name: Facebook Conversion Api
slug: facebook-conversion-api
type: plugin
version: 1.1.0
description: Facebook Conversion API integration
icon: facebook
author:
  name: Paul Massendari
  email: paulmassendari@pm.me
homepage: https://github.com/paulmassen/grav-plugin-fbconversionsapi
keywords: grav, plugin, facebook, meta, conversions api, tracking
bugs: https://github.com/paulmassen/grav-plugin-fbconversionsapi/issues
docs: https://github.com/paulmassen/grav-plugin-fbconversionsapi/blob/main/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    debug:
      type: toggle
      label: Debug
      help: Logs every event sent and every API response in logs/grav.log. Leave disabled in production.
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    test_event_code:
      type: text
      label: Test Event Code
      help: Only for testing (Events Manager > Test events). While set, events are NOT counted as real events. Leave empty in production.
      placeholder: Example TEST123456

    credentials:
      type: section
      title: Credentials Facebook
      underline: true
      fields:
        pixel_id:
          type: text
          label: Facebook Pixel (dataset) ID
          help: Events Manager > your dataset > Settings > Dataset ID.
          validate:
            required: true

        access_token:
          type: text
          label: Facebook Conversions API Access Token
          help: Must be generated from the SAME dataset (Events Manager > dataset > Settings > Conversions API > Generate access token).
          validate:
            required: true

        api_version:
          type: text
          label: Graph API version
          help: Graph/Marketing API version used for the calls.
          default: v25.0
          placeholder: v25.0

    tracking:
      type: section
      title: Tracking Configuration
      underline: true
      fields:
        track_pageviews:
          type: toggle
          label: PageView Tracking
          help: If enabled, a PageView event is sent for each page view (after the page has been delivered to the visitor).
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        exclude_bots:
          type: toggle
          label: Ignore bots
          help: Do not send events for crawlers, scanners, monitoring tools and requests without user agent.
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        allowed_hosts:
          type: array
          label: Allowed hosts
          help: Only send events for requests on these domains (e.g. www.example.com). Empty = all domains.
          value_only: true
          placeholder_value: www.example.com

        pause_on_error:
          type: number
          label: Pause after configuration error (seconds)
          help: When Facebook rejects the token or pixel ID, sending is paused for this duration. 0 = never pause.
          default: 3600
          validate:
            type: int
            min: 0
